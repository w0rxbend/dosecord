# Pre-commit hooks (ROADMAP G0.8). Install once with `pre-commit install`;
# without the pre-commit tool, the same check is the plain git hook
#   printf '#!/bin/sh\nexec scripts/secret-scan.sh --staged\n' > .git/hooks/pre-commit
#   chmod +x .git/hooks/pre-commit
# Both need gitleaks 8.30.1 on PATH (or GITLEAKS naming the binary). The rules
# are the ones CI runs: .gitleaks.toml.
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan (gitleaks, .gitleaks.toml)
        entry: scripts/secret-scan.sh --staged
        language: system
        pass_filenames: false
        always_run: true
