# CI and quality gates (ROADMAP M0.4). The exact local equivalents of every
# job are the commands in each `run:` step; the gate scripts live in scripts/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  scalafmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill', '.mill-version') }}
      - run: ./mill __.checkFormat

  scalafix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill', '.mill-version') }}
      - run: ./mill __.fix --check

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dosegram
          POSTGRES_PASSWORD: dosegram
          POSTGRES_DB: dosegram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dosegram -d dosegram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill', '.mill-version') }}
      # The pixel tests draw with the pinned resvg (ADR-022); with
      # DOSEGRAM_REQUIRE_RESVG they fail instead of skipping without it.
      - name: install resvg 0.49.0
        run: |
          curl -fsSL -o /tmp/resvg.tar.gz https://github.com/linebender/resvg/releases/download/v0.49.0/resvg-linux-x86_64.tar.gz
          echo "216637e75e909e53e3098b0875cd5f7da2fdc8b4359771b4a29b539afff9d3f5  /tmp/resvg.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/resvg.tar.gz -C /usr/local/bin resvg
          resvg --version | grep -qx '0.49.0'
      # scalacOptions carry -Werror -Wunused:all -deprecation (build.mill).
      - run: ./mill __.compile
      # Infra tests use Testcontainers (Docker is available on the runner).
      - run: ./mill __.test
        env:
          DOSEGRAM_REQUIRE_RESVG: "true"
      # M0.5: the committed .env.example must equal the generated one.
      - run: ./mill app.test.runMain dosegram.app.envExampleCheck .env.example
      # G3.1: the committed OpenAPI document must equal the one generated from the Tapir endpoints.
      - run: ./mill api.test.runMain dosegram.api.openApiCheck api/openapi.json
      - name: flyway validate
        run: scripts/flyway-validate.sh

  vendor-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-vendor-symbols.sh

  # M1.5: SQL now() is allowed only in DEFAULT clauses; queries bind `now`.
  sql-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-sql-now.sh

  # ADR-002 addendum of 2026-11-13: real data exists, so a committed Flyway
  # migration is never edited; every schema change is a new versioned migration.
  frozen-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-frozen-migrations.sh

  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/doc-lint.sh
      - run: scripts/test-doc-lint.sh

  # Frontend gate (docs/ROADMAP.md section 0.6, FG). miniapp/ has its own Node
  # toolchain and is not a Mill module. `e2e` joins this job with the slice
  # that creates it (G3.12).
  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # The version that wrote and last verified miniapp/pnpm-lock.yaml.
      - run: npm install --global pnpm@12.18.0
      - run: pnpm --dir miniapp install --frozen-lockfile
      - run: pnpm --dir miniapp run check
      - run: pnpm --dir miniapp run test
      - run: pnpm --dir miniapp run build
      # G3.1: the committed client types must equal the ones generated from api/openapi.json.
      - run: pnpm --dir miniapp run api:check

  # M0.5: the Dockerfile is born here — build the image, then a compose smoke
  # (/healthz 200, idle RSS <= 200 MB with the console adapter enabled).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -f docker/Dockerfile -t dosegram:ci .
      - name: the image draws text with its own resvg and font pack
        run: scripts/image-render-check.sh dosegram:ci
      - name: compose smoke
        run: |
          docker compose -f docker/compose.yml up -d --build --wait
          curl --retry 12 --retry-delay 2 --retry-connrefused -fsS http://localhost:28080/healthz
      - name: idle RSS <= 200 MB
        run: scripts/rss-check.sh 200
      - name: compose down
        if: always()
        run: docker compose -f docker/compose.yml down -v

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill', '.mill-version') }}
      - run: scripts/license-gate.sh

  # Coverage-gate scaffold: 85% on core/domain and core/chat, measured but
  # NOT enforced until M1 exit (then set COVERAGE_GATE_ARMED: "true").
  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_GATE_ARMED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill', '.mill-version') }}
      - run: ./mill core.test
      - run: ./mill core.scoverage.xmlReport
      - run: scripts/coverage-gate.sh
