name: Roadmap slice
description: Claim one dependency-unblocked Dosegram delivery slice.
title: "[G0.0] "
labels: [roadmap]
body:
  - type: input
    id: slice
    attributes:
      label: Roadmap slice
      description: Use the exact ID and name from docs/ROADMAP.md.
      placeholder: G0.8 Secret scanning and pinned CI actions
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List every dependency, the milestone gate and their Appendix B status.
      placeholder: G0.4 green; pull-forward, no milestone gate.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the criteria from the roadmap verbatim.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest reviewable scope
      description: Name the files or behavior this slice changes.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks or open decisions
      description: Name any named ADR, spike, or unresolved design conflict.
