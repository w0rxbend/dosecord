services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dosecord
      POSTGRES_PASSWORD: dosecord
      POSTGRES_DB: dosecord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosecord -d dosecord"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
