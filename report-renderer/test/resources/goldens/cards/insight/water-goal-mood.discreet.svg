<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="1080" height="1080" fill="#0f222b"/>
<text x="64" y="120" font-family="Geologica" font-weight="600" font-size="64" fill="#e8f0f4">A pattern in your records</text>
<text x="64" y="188" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#b1c0c8">13 Oct to 9 Nov</text>
<rect x="64" y="236" width="952" height="452" rx="40" fill="#071820"/>
<text x="96" y="296" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#e8f0f4">Water goal reached</text>
<line x1="96" y1="376" x2="852" y2="376" stroke="#2f434d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <line x1="96" y1="376" x2="606.3" y2="376" stroke="#bf3f75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="606.3" cy="376" r="22" fill="#bf3f75" stroke="#071820" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="984" y="396" font-family="IBM Plex Sans" font-weight="600" font-size="56" fill="#e8f0f4" text-anchor="end">3.7</text>
<text x="96" y="428" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#b1c0c8">18 days</text>
<text x="96" y="512" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#e8f0f4">Water logged, goal not reached</text>
<line x1="96" y1="592" x2="852" y2="592" stroke="#2f434d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <line x1="96" y1="592" x2="511.8" y2="592" stroke="#bf3f75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="511.8" cy="592" r="22" fill="#bf3f75" stroke="#071820" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="984" y="612" font-family="IBM Plex Sans" font-weight="600" font-size="56" fill="#e8f0f4" text-anchor="end">3.2</text>
<text x="96" y="644" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#b1c0c8">9 days</text>
<text x="96" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#8b9ba3" text-anchor="middle">1</text>
<text x="285" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#8b9ba3" text-anchor="middle">2</text>
<text x="474" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#8b9ba3" text-anchor="middle">3</text>
<text x="663" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#8b9ba3" text-anchor="middle">4</text>
<text x="852" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#8b9ba3" text-anchor="middle">5</text>
<text x="64" y="800" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#b1c0c8">Mood is the daily average on the 1 to 5 scale.</text>
<text x="64" y="856" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#e8f0f4">This compares your own days.</text>
<text x="64" y="908" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#e8f0f4">It does not show a cause.</text>
<text x="64" y="1016" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#8b9ba3">Recorded entries only. Not medical advice.</text>
</svg>
