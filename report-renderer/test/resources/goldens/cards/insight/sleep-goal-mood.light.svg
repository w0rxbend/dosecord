<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="1080" height="1080" fill="#eef5f8"/>
<text x="64" y="120" font-family="Geologica" font-weight="600" font-size="64" fill="#13242e">A pattern in your records</text>
<text x="64" y="188" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#435561">13 Oct to 9 Nov</text>
<rect x="64" y="236" width="952" height="452" rx="40" fill="#ffffff"/>
<text x="96" y="296" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#13242e">After nights at or above your sleep goal</text>
<line x1="96" y1="376" x2="852" y2="376" stroke="#cdd6db" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <line x1="96" y1="376" x2="606.3" y2="376" stroke="#940f52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="606.3" cy="376" r="22" fill="#940f52" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="984" y="396" font-family="IBM Plex Sans" font-weight="600" font-size="56" fill="#13242e" text-anchor="end">3.7</text>
<text x="96" y="428" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#435561">18 days</text>
<text x="96" y="512" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#13242e">After shorter nights</text>
<line x1="96" y1="592" x2="852" y2="592" stroke="#cdd6db" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <line x1="96" y1="592" x2="474" y2="592" stroke="#940f52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="474" cy="592" r="22" fill="#940f52" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="984" y="612" font-family="IBM Plex Sans" font-weight="600" font-size="56" fill="#13242e" text-anchor="end">3.0</text>
<text x="96" y="644" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#435561">9 days</text>
<text x="96" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#5e6e78" text-anchor="middle">1</text>
<text x="285" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#5e6e78" text-anchor="middle">2</text>
<text x="474" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#5e6e78" text-anchor="middle">3</text>
<text x="663" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#5e6e78" text-anchor="middle">4</text>
<text x="852" y="740" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#5e6e78" text-anchor="middle">5</text>
<text x="64" y="800" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#435561">Mood is the daily average on the 1 to 5 scale.</text>
<text x="64" y="856" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#13242e">This compares your own days.</text>
<text x="64" y="908" font-family="IBM Plex Sans" font-weight="500" font-size="44" fill="#13242e">It does not show a cause.</text>
<text x="64" y="1016" font-family="IBM Plex Sans" font-weight="500" font-size="40" fill="#5e6e78">Recorded entries only. Not medical advice.</text>
</svg>
