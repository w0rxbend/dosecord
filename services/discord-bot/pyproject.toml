[tool.poetry]
name = "dosecord-discord-bot"
version = "0.1.0"
description = "Discord bot frontend for Dosecord wellbeing tracking"
authors = ["Dosecord Team"]
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
"discord.py" = "^2.3"
python-dotenv = "^1.0"
pydantic = "^2.0"
pydantic-settings = "^2.2"
confluent-kafka = "^2.3"
aiohttp = "^3.8"

[tool.poetry.dev-dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
black = "^23.0"
flake8 = "^6.0"
mypy = "^1.0"

[tool.poetry.scripts]
dosecord-bot = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
