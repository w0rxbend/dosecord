[tool.poetry]
name = "dosecord-backend"
version = "0.1.0"
description = "Backend service for Dosecord wellbeing tracking"
authors = ["Dosecord Team"]
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0"
pydantic = "^2.0"
pydantic-settings = "^2.2"
confluent-kafka = "^2.3"
sqlalchemy = "^2.0"
alembic = "^1.11"
asyncpg = "^0.28"

[tool.poetry.dev-dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
black = "^23.0"
flake8 = "^6.0"
mypy = "^1.0"

[tool.poetry.scripts]
dosecord-backend = "src.main:main"
dosecord-backend-init-db = "src.workers.init_db:main"
dosecord-outbox-publisher = "src.workers.outbox_publisher:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
