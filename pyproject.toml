[tool.poetry]
name = "dosecord"
version = "0.1.0"
description = "Wellbeing tracking Discord bot with multi-service architecture"
authors = ["Dosecord Team"]
readme = "README.md"
packages = [
    { include = "shared" },
]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0"
pydantic = "^2.0"
pydantic-settings = "^2.2"
confluent-kafka = "^2.3"

[tool.poetry.dev-dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
black = "^23.0"
flake8 = "^6.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
